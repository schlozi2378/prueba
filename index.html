
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub einfach erklärt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 40px 20px;
        }

        h1 {
            color: #24292f;
            font-size: 42px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        img {
            width: 280px;
            max-width: 100%;
            border-radius: 15px;
        }

        .karte {
            background: white;
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="karte">
        <h1>Was ist GitHub?</h1>

        <img
            src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
            alt="GitHub Logo"
        >

        <p>
            GitHub ist eine Plattform, auf der du Code speichern,
            teilen und gemeinsam mit anderen entwickeln kannst.
        </p>

        <p>
            💻 Code speichern<br>
            🌍 Projekte teilen<br>
            🤝 Zusammenarbeiten
        </p>
    </div>
</body>
</html>
